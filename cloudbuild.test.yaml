# Build and deploy the TEST app from a push to `main` — Abhishek, 29 Sep 2026.
#
# ─── WHY A SECOND FILE AND NOT AN EDIT TO cloudbuild.yaml ───────────────────
#   `cloudbuild.yaml` targets PRODUCTION: project `resellsubsos-prod`, service
#   `resellersos`, region asia-southeast1. Measured 29 Sep 2026 — this account
#   (abhishek@example.test) gets PERMISSION_DENIED on that project and cannot
#   even describe it. Editing that file to point here would leave the production deploy
#   with no config at all, and whoever owns that project would find out the hard way.
#
#   So production keeps its file untouched, and the test app gets its own. The two
#   differ ONLY in the substitutions at the bottom; every step below is the same shape,
#   for the same reasons, so a fix to one is an obvious fix to the other.
#
# ─── WHICH BRANCH FIRES THIS ────────────────────────────────────────────────
#   `main`, by Abhishek's decision (29 Sep 2026). The production file's own comment
#   warns against triggering on the branch that is committed to daily — measured then,
#   a session branch took 39 commits in one day and would have deployed 39 times.
#
#   That warning does not apply here: day-to-day work happens on `abhishek-pre-merge`,
#   and `main` only moves when somebody deliberately merges. So a push to `main` IS the
#   "I mean it" signal that the production file achieves with a separate `deploy` branch.
#
#   ⚠️ The consequence, stated plainly: merging to `main` now DEPLOYS. It is no longer
#   just a bookkeeping merge. Run `npm run build` before merging, because `tsc`, vitest
#   and eslint all pass on a build that `next build` rejects (CLAUDE.md §25.2), and with
#   a trigger in place that broken image would ship by itself.
#
# ─── THE BUILD CONTEXT IS production/, NOT THE REPO ROOT ────────────────────
#   The Dockerfile lives in production/. Pointing Cloud Build at the repo root makes it
#   fail to find a Dockerfile and silently fall back to buildpacks, which then errors
#   with "no buildpack groups passed detection".

steps:
  # 0. THE GATE. Typecheck + unit tests BEFORE the image is built, so a red commit on
  #    `main` fails here and never reaches Cloud Run. Same step as production's, and
  #    kept for the same reason: a deploy that skips its gate is how a bad afternoon
  #    starts. No env or secret is needed — the unit tests are pure logic.
  - id: gate
    name: node:20
    dir: production
    entrypoint: bash
    args:
      - -c
      - npm ci --no-audit --no-fund && npx tsc --noEmit && npx vitest run

  # 1. Build. Tagged with the commit SHA as well as :latest, so "which build is live"
  #    is answerable. The SHA also goes INSIDE the image, which is what makes
  #    /api/version report a commit instead of the string "dev" — measured on the live
  #    test service 29 Sep 2026, it returns {"sha":"dev"} because the current image was
  #    pushed by hand without this arg.
  - id: build
    waitFor: [gate]
    name: gcr.io/cloud-builders/docker
    dir: production
    args:
      - build
      - --tag=$_IMAGE:$SHORT_SHA
      - --tag=$_IMAGE:latest
      - --build-arg=BUILD_SHA=$SHORT_SHA
      - --build-arg=BUILD_ID=$BUILD_ID
      # Next 15's type-check pass was OOM-killed at the Dockerfile's default 6144 MB
      # inside an 8 GB machine. A LOWER cap is not a downgrade here: Node collects
      # earlier and stays inside the container, instead of the container being killed
      # with no message at all.
      - --build-arg=NODE_HEAP_MB=4096
      # NEXT_PUBLIC_* is substituted into the CLIENT BUNDLE by `next build`, so these
      # must be build args. Supplying them to the running container instead arrives as
      # undefined in the browser (CLAUDE.md L42/L43 — this cost two rebuilds to learn).
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=$_SUPABASE_URL
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=$_SUPABASE_ANON_KEY
      - --build-arg=NEXT_PUBLIC_APP_URL=$_APP_URL
      - --build-arg=NEXT_PUBLIC_APP_ENV=$_APP_ENV
      - .

  # 1b. PUSH, and it is not optional — 29 Sep 2026, build 242c3243.
  #
  #     The `images:` block at the bottom pushes these tags, but Cloud Build does that
  #     AFTER every step has finished. So the deploy step below ran while the image
  #     existed only on the build worker's local docker, and died with
  #     "Image ...:89493fd not found" — after a gate and a build that had both PASSED.
  #     That reads as a broken build and is a missing push.
  #
  #     `cloudbuild.yaml` (production) has always had this step. This file was written
  #     from it and dropped the one step whose absence nothing catches until deploy.
  - id: push
    waitFor: [build]
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_IMAGE]

  # 2. Deploy, pinned to the commit's own tag rather than :latest.
  - id: deploy
    waitFor: [push]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --timeout=600
      - --quiet
    # NOTE: no --set-env-vars, deliberately. That flag REPLACES the whole set, and this
    # service carries SUPABASE_SERVICE_ROLE_KEY and RAZORPAY_WEBHOOK_SECRET from Secret
    # Manager plus CRON_SECRET inline. Omitting it means `run deploy` keeps what is
    # already configured. To add one, use
    # `gcloud run services update --update-env-vars`, never --set-env-vars.

substitutions:
  # ── Measured from the live service on 29 Sep 2026, not copied from production ──
  _REGION: asia-south1
  _SERVICE: reselleros-test
  _IMAGE: asia-south1-docker.pkg.dev/boxwood-victor-453804-v4/resellerps/reselleros-test
  # The test API on VM `resellerps-test` (34.0.227.248). Its A record pointed at a dead
  # host until 29 Sep 2026 — see R-029.
  _SUPABASE_URL: https://test-api.anutech.in
  # Public by design: this key ships in every browser that loads the app. It is NOT a
  # secret and does not belong in Secret Manager.
  #
  # ⚠️ BUT READ THIS. Its payload says `"iss": "supabase-demo"` — this is the DEFAULT
  # key published in Supabase's own self-hosting docs, which means the instance is very
  # likely still using the published demo JWT_SECRET. If so, anybody can mint a
  # service_role token for test-api.anutech.in and read or write the whole test
  # database. Raised separately; not this file's job to fix, and rotating the secret
  # changes this value.
  _SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  _APP_URL: https://reselleros-test-smsthitvnq-el.a.run.app
  _APP_ENV: test

images:
  - $_IMAGE:$SHORT_SHA
  - $_IMAGE:latest

options:
  logging: CLOUD_LOGGING_ONLY
  # E2_HIGHCPU_32 was tried on 29 Sep 2026 and REFUSED before the build even started:
  # "due to quota restrictions, Cloud Build cannot run builds of this machine type in
  # this region". So 8 GB is what there is, and the build is made to fit it instead --
  # see NODE_HEAP_MB above and the note in production/Dockerfile.
  machineType: E2_HIGHCPU_8

# The first attempt used 28m35s of a 30m budget, so even a healthy build had about ninety
# seconds of margin. A build that times out deploys nothing while reading like a code
# failure, which is the worst way to lose an afternoon.
timeout: 3600s
