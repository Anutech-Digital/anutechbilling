# SQL regression tests — production/supabase/tests/*.test.sql against a throwaway database
#
# ─── WHY (WC-ci, 30 Sep 2026) ───────────────────────────────────────────────
# These tests guard the money path (record_payment idempotency, immutable issued invoices,
# serial numbers never reused) and tenant isolation. CLAUDE.md §25.2 said they were "not
# in CI and not in the hook" — the only way they ran was somebody remembering to run
# `npm run test:sql` by hand. Now every push / PR that touches the database folder runs
# them against a local Supabase stack inside the runner. No secret, no production access.
#
# ─── HOW THE DATABASE IS BUILT (same as `npm run setup`) ─────────────────────
# The schema comes from supabase/baseline.sql (a production snapshot, 15 Aug 2026), NOT
# from `supabase start` running supabase/migrations/ on an empty database — those files
# ALTER tables only the baseline creates, so the first one would fail (see
# scripts/rebuild-db.mjs and supabase/migrations-archive/README.md). So:
#   1. `supabase start` with the migrations folder moved aside  → empty Postgres + auth/storage
#   2. scripts/rebuild-db.mjs --local                           → baseline + storage + seed
#   3. every file in supabase/migrations/, in name order        → today's schema
#   4. npm run test:sql:local                                   → the suite (canary first)
# Step 4 uses `test:sql:local`, not plain `test:sql`: the plain script targets the LINKED
# (remote) project, which a CI runner must never do.
#
# ─── BLOCKING ───────────────────────────────────────────────────────────────
# A red test fails the run. To make it gate merges, add `sql-tests` as a required status
# check in branch protection — but note the `paths` filter: a PR that does not touch the
# database never runs this workflow, and GitHub then waits forever for a required check
# that will not come. Either leave it non-required (it still shows red on the PR/commit)
# or require it only on branches where every PR touches supabase/.
name: SQL tests

on:
  push:
    branches: [main, deploy, 'session/**', manager-pardeep, billing-abhishek, website-pawan, accounts-hitesh, pardeep-sir, abhishek-pre-merge, pawan-api-system, hitesh-qa]
    paths:
      - "production/supabase/**"
      - "production/scripts/test-sql.mjs"
      - "production/scripts/rebuild-db.mjs"
      - ".github/workflows/sql-tests.yml"
  pull_request:
    paths:
      - "production/supabase/**"
      - "production/scripts/test-sql.mjs"
      - "production/scripts/rebuild-db.mjs"
      - ".github/workflows/sql-tests.yml"

permissions:
  contents: read

concurrency:
  group: sql-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The scripts below use only Node built-ins + the `supabase` CLI + docker — no npm ci.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (schema-less — migrations moved aside)
        run: |
          set -euo pipefail
          mv supabase/migrations "$RUNNER_TEMP/migrations"
          mkdir supabase/migrations
          # Studio, edge runtime, analytics and image proxy are not needed for SQL tests.
          supabase start -x studio,edge-runtime,logflare,vector,imgproxy
          rmdir supabase/migrations
          mv "$RUNNER_TEMP/migrations" supabase/migrations

      - name: Load the production baseline (baseline.sql + storage + seed)
        run: node scripts/rebuild-db.mjs --local

      - name: Apply supabase/migrations/ in order
        run: |
          set -euo pipefail
          DB="supabase_db_$(sed -n 's/^project_id *= *"\([^"]*\)".*/\1/p' supabase/config.toml)"
          # R-380 (7 Oct 2026): 20261002190000_storage_policies.sql does `set local role
          # supabase_storage_admin` (storage.objects is owned by that role). On production /
          # staging the migrator (postgres / resellersos_migration) is a member of it; in the
          # local Supabase image `postgres` is not, so every run since 2 Oct died here with
          # "permission denied to set role". Give the CI `postgres` the same membership —
          # the migration itself is unchanged.
          docker exec -i "$DB" psql -v ON_ERROR_STOP=1 -q -U supabase_admin -d postgres \
            -c "grant supabase_storage_admin to postgres"
          # R-401 (7 Oct 2026) — emulate Cloud SQL's function privileges. Local Supabase gives
          # every function `postgres` creates in public EXECUTE to anon/authenticated/
          # service_role (default privileges) and to PUBLIC (Postgres built-in). Cloud SQL
          # (staging/live) gives neither: its default privileges were deferred at the 6 Sep
          # cut-over (supabase/cloudsql/01b). So R-381's trigger helper, created without a
          # GRANT, was callable here and a 403 on every staging quote save (R-400). From
          # CLOUDSQL_FROM on — the same cut-off as the repo scan
          # src/lib/security/invoker-function-grants.test.ts — new functions get only the
          # grants their migration writes, and the suite's
          # authenticated_quote_write_cloudsql.test.sql writes a quote as authenticated.
          # CI database only; nothing here touches staging or live.
          CLOUDSQL_FROM=20261001
          EMULATED=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            if [ "$EMULATED" = 0 ] && [[ "$(basename "$f")" > "$CLOUDSQL_FROM" ]]; then
              echo "::notice::Cloud SQL emulation: revoking default function EXECUTE before $(basename "$f")"
              docker exec -i "$DB" psql -v ON_ERROR_STOP=1 -q -U postgres -d postgres <<'SQL'
          alter default privileges for role postgres in schema public
            revoke execute on functions from public, anon, authenticated, service_role;
          alter default privileges for role postgres revoke execute on functions from public;
          SQL
              EMULATED=1
            fi
            echo "::group::$f"
            docker exec -i "$DB" psql -v ON_ERROR_STOP=1 -q -U postgres -d postgres < "$f"
            echo "::endgroup::"
          done
          # The emulation must have bitten: R-381's helper is granted to authenticated only
          # (20261007250000), so anon — which only ever had it through PUBLIC — must not have it.
          docker exec -i "$DB" psql -v ON_ERROR_STOP=1 -q -U postgres -d postgres -c \
            "do \$\$ begin if has_function_privilege('anon', 'public.quote_line_terms_mixed(jsonb)', 'execute') then raise exception 'Cloud SQL emulation did not apply: PUBLIC still has EXECUTE on new functions'; end if; end \$\$"

      - name: Run the SQL test suite
        run: npm run test:sql:local

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
