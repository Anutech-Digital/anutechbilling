name: CI
# ─── THE TRIGGERS NAMED BRANCHES THAT DO NOT EXIST ───────────────────────────
# Until 27 Aug 2026 this said `branches: [master, v3-dev]`. Measured against the repo that
# day, the branches are: main, deploy, session/money-spine-hardening-jun1,
# integrate-custom-panel. `master` was renamed to `main` at some point and this file was
# never updated, so the push trigger matched NOTHING and CI only ever ran on a pull request.
#
# The cost was not theoretical. On 26 Aug, eleven commits went straight to `deploy` with no
# PR, so CI ran on none of them — the last run on GitHub was 15 Aug. Every one of those
# deploys was gated only by somebody running the commands on their laptop.
#
# ─── WHO STOPS A BAD DEPLOY (S18, Sep 2026) ──────────────────────────────────
# Cloud Build watches the `deploy` branch itself (cloudbuild.yaml) and starts the moment the
# push lands — in PARALLEL with this workflow, so this file cannot stop a deploy on its own.
# The deploy gate therefore lives in cloudbuild.yaml's first step (`gate`: npm ci, tsc,
# vitest); a red commit fails there and never reaches Cloud Run.
#
# This workflow is the WIDER gate: everything below is blocking (nothing is
# continue-on-error in `checks` any more) — typecheck, unit tests, lint with a per-rule
# warning ratchet, migration file order, and the full `next build`. It gates MERGES once
# GitHub branch protection marks `checks` as a required status for main/deploy (a repo
# setting — not something this file can switch on).
#
# ─── THE THREE WORKING BRANCHES WERE NOT WATCHED EITHER (WC-ci, 30 Sep 2026) ──
# Day-to-day work lands on manager-pardeep / billing-abhishek / website-pawan (and QA on
# accounts-hitesh), not on main — so until today CI ran on none of it until somebody opened a PR.
# They are pushed to directly, so they are listed here directly.
on:
  push:
    branches: [main, deploy, 'session/**', manager-pardeep, billing-abhishek, website-pawan, accounts-hitesh, pardeep-sir, abhishek-pre-merge, pawan-api-system, hitesh-qa]
  pull_request:
# ─── R-1593 (18 Oct 2026): STOP PAYING FOR RUNS NOBODY WILL READ ─────────────
# ~90 workers push manager-pardeep back to back; every push ran the full gate (~17-20 min) and
# every OLDER run on the same branch kept running too. R-1424: Actions hit the spending limit.
# One group per workflow + ref (a PR's ref is refs/pull/N/merge, so per PR): a newer push
# cancels the older run. main/deploy are NOT cancelled — each commit there keeps its own result.
# Which checks run is unchanged; tests/ops/ci-workflow.test.ts pins all of this.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/deploy' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    # A normal run takes 17-20 min (gh run list, 18 Oct). A hung build/test stops here instead
    # of burning GitHub's 6-hour default.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the migration check needs the merge-base with its base ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: production/package-lock.json

      # Migration FILES only (names, unique versions, no edited/renamed old migration, new
      # ones newer than the base's newest) — git, no database. See the script header.
      # Base: the PR's target branch, or for a push whatever the branch pointed at before
      # it (a brand-new branch has no "before"; the script then skips the base checks).
      - name: Migration order check
        env:
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/migration-order-check.mjs

      # The NEXT_PUBLIC_* values below must be the ones production/Dockerfile builds with
      # (and cloudbuild.yaml substitutes). Files only, no install needed — so it runs first.
      - name: Config drift check (ci.yml / cloudbuild.yaml vs Dockerfile)
        run: node scripts/check-config-drift.mjs

      # R-1430: the repo is PUBLIC. Lines added by this push / PR must hold no secret, key file,
      # client term or personal contact. Prints file:line + rule only, never the value. A new
      # branch (no "before") gets a full-tree scan. Client terms come from a repo secret.
      - name: Secret / client-data scan
        env:
          SECRET_SCAN_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          SECRET_SCAN_DENY_TERMS: ${{ secrets.SECRET_SCAN_DENY_TERMS }}
        run: node scripts/ops/secret-scan.mjs --diff "$SECRET_SCAN_BASE"

      - run: npm ci
      # Advisory, NOT blocking: a new advisory in a transitive dependency appears overnight
      # without any commit here, and should not turn every branch red at once. It is visible
      # in each run's log; Dependabot (.github/dependabot.yml) opens the upgrade PRs.
      - name: npm audit (production deps, high+) — advisory
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      # 11 Oct 2026 (R-712): `tsc --noEmit` now hits the same default ~2 GB old-space cap the
      # build hit on 28 Aug (exit 134, "Ineffective mark-compacts near heap limit") on three
      # runs in a row with no TypeScript change. Same fix as the build step below.
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run test
      # Blocking since S18. `next lint` fails on any ESLint ERROR; the ratchet fails when any
      # rule has more WARNINGS than lint-baseline.json allows (no-explicit-any, max-lines…).
      - run: npm run lint
      - run: npm run lint:ratchet

      # R-1593: Next's own build cache (webpack/SWC output). Keyed on the lockfile + every
      # source/config file, so an unchanged tree is an exact hit; on any change the restore-key
      # brings back the newest cache for the same lockfile and Next rebuilds only what changed.
      # npm's download cache is the `cache: npm` on setup-node above.
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: production/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('production/package-lock.json') }}-${{ hashFiles('production/src/**', 'production/public/**', 'production/next.config.mjs', 'production/tsconfig.json', 'production/tailwind.config.ts', 'production/postcss.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('production/package-lock.json') }}-

      # ── The build, and why the other three do not cover it ──────────────────
      # CLAUDE.md §25.2, written after a deploy attempt found the build broken while
      # typecheck, test and lint were all green: `next.config` sets
      # `experimental.typedRoutes`, and Next generates those route types AT BUILD TIME. So
      # `tsc --noEmit` checks against types that do not exist yet and happily passes a
      # `<Link href="...">` the build rejects. Vitest never renders it; ESLint does not
      # type-check. The cost of leaving it out was not a red tick — it was a production
      # release that could not happen, with nothing in the gate saying so.
      #
      # Env: the SAME two publishable values production/Dockerfile's ARG defaults set, so
      # this build is the build that ships rather than a different one. They are public by
      # definition (anon key) and already committed there — this is not a new exposure.
      # ⚠️ It IS a second copy. Until 30 Sep 2026 it still said the old hosted project
      # (ontpnqjoysjgrlsukecm.supabase.co) after the Dockerfile moved to api.anutech.in;
      # scripts/check-config-drift.mjs (step above) now fails the job when they differ.
      - name: Build (catches what typecheck cannot — see comment)
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://api.anutech.in"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9udHBucWpveXNqZ3Jsc3VrZWNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNjc1NjcsImV4cCI6MjA5NDg0MzU2N30.tulYYDQSzq7IpEQCFbP7qjsSUxg4c-0ku5uO80-TKXI"
          # ─── THE RUNNER'S NODE HEAP IS SMALLER THAN THIS MACHINE'S ─────────
          # First real CI run, 28 Aug 2026: exit 134, "Ineffective mark-compacts near heap
          # limit", dying at 1898 of 2078 MB. That ceiling is Node's default old-space cap,
          # which it picks from available RAM — a laptop with plenty gets a bigger one, so
          # `npm run build` passes locally and dies here. Nothing about the code changed.
          #
          # Worth being precise about the blast radius: this never affected production.
          # Cloud Build runs the Docker build with its own resources and has been green
          # throughout. It is CI, and only CI, that needed the bigger heap.
          NODE_OPTIONS: --max-old-space-size=4096
          # R-1102 (11 Oct 2026): `next build` pre-renders the marketing pages, which read the
          # price list (site/lib/live-catalog.ts). No app runs here, so without this the build
          # called the LIVE domain and logged 503s there from Azure runner IPs. A closed local
          # port fails at once and the pages build with the typed fallback prices.
          CATALOG_ORIGIN: "http://127.0.0.1:9"
        run: npm run build

  # ── No-auth E2E smoke ──────────────────────────────────────────────
  # Runs the auth-free Playwright specs (smoke.spec.ts + money-spine public
  # buy page) against the deployed app. This is a funnel canary: it catches a
  # 500'd login page, a broken auth redirect, or a buy page that stopped
  # rendering a price — without needing any Supabase secret in CI.
  #
  # Base URL defaults to prod; override per-repo via the PLAYWRIGHT_BASE_URL
  # repository variable (e.g. point it at a Cloud Run preview revision).
  #
  # The auth-gated specs (full lead→quote→pay→invoice funnel, RLS, roles)
  # self-skip here because NEXT_PUBLIC_SUPABASE_ANON_KEY + seeded test users
  # are absent. To light them up: add the anon key as a CI secret and seed the
  # Tenant-A/B fixtures on a Supabase branch, then drop `continue-on-error`.
  #
  # Non-blocking for now (unlike `checks`) so a transient prod blip never blocks a
  # merge; flip to required once it has proven stable.
  e2e-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    # R-1593: install + chromium + three no-auth specs; a hung browser stops here.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: production/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run no-auth E2E smoke
        env:
          # ─── THE OLD DEFAULT POINTED AT A DEAD SERVICE ─────────────────────
          # It was resellersos-490252291080.asia-south1.run.app. Measured 27 Aug 2026: that
          # host answers 500 (503 on / and /login), while the live service answers 200. The
          # number in the middle is the GCP PROJECT NUMBER, so a stale one is a different
          # project entirely, not a redirect.
          #
          # This job is `continue-on-error: true`, which is why nobody noticed: a canary that
          # cannot reach the app fails exactly like a canary reporting bad news, and neither
          # blocks anything. It had been watching nothing since the project moved.
          #
          # The host below is the CANONICAL one — measured 28 Aug 2026 from
          # `gcloud run services describe`, and it is what the service's own
          # NEXT_PUBLIC_APP_URL is set to, so it is the host in OAuth redirects and in every
          # link the app emails out. `resellersos-1005662057478.asia-south1.run.app` is a
          # live ALIAS for the same service and is what the Cloud Scheduler jobs call — do
          # not "fix" those to match this one.
          #
          # 30 Sep 2026 (WC-ci): the paragraph above is superseded by commit 23eecf13 (7 Sep) —
          # NEXT_PUBLIC_APP_URL is now https://reselleros.anutech.in (Dockerfile ARG default,
          # cloudbuild.yaml _APP_URL, docs/ROLLBACK.md), a domain bound to whichever service is
          # live, so it survives the next region move the way a run.app host does not.
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://reselleros.anutech.in' }}
        # suite-health.spec.ts is the tripwire the repo built for "70 auth-gated
        # tests silently skip and the run still reads green" — and then left out
        # of this very list, so it never fired (audit A6, 1 Sep 2026). It is IN
        # now: while .env.test / CI secrets don't exist it goes red inside this
        # already-non-blocking job, which makes the dark half of the e2e suite
        # visible in every run instead of invisible in all of them. Seeding the
        # fixtures (a Supabase branch + two test users) turns it green — that
        # decision needs DB credentials as repo secrets, which is Pardeep's call.
        #
        # R-855 (11 Oct 2026): "red in every run" backfired — the permanently red job
        # was read as the CI blocker and nobody could tell a real smoke failure from it.
        # Now, with ZERO auth secrets in the repo, suite-health SKIPS and prints
        # "[suite-health] SKIP: SKIPPED: …" naming every variable it looked for, so the
        # log still says the auth half did not run. The moment ANY of those secrets is
        # added it is a hard gate again: partial setup = red. Logic + unit test:
        # e2e/fixtures/suite-health-verdict.mjs, tests/suite-health-verdict.test.ts.
        # Do not pass auth secrets to this job until R-839 (Auth.js E2E seed) lands —
        # this job targets the production host, where the seed must never run.
        run: npx playwright test smoke.spec.ts money-spine.spec.ts suite-health.spec.ts --project=chromium
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: production/playwright-report/
          retention-days: 7
