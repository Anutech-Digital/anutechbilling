# Build and deploy ResellerOS from a git push — no credential on anybody's laptop.
#
# WHY THIS EXISTS
#   Deploying used to mean `gcloud auth login` on Pardeep's machine, and that token expires
#   every few hours — twice in one session on 22 Aug. The alternative usually suggested is a
#   service-account key file, which never expires and is exactly why it is dangerous: a
#   permanent production credential sitting in a folder, revocable only by someone who
#   notices. This does the deploy in Google's own infrastructure instead, so there is no key
#   to leak.
#
# ─── WHICH BRANCH FIRES THIS, AND WHY IT MATTERS MORE THAN THE YAML ──────────
#   Measured on 22 Aug: the session branch is 166 commits ahead of main, and 39 of those
#   commits were made in a single day. A trigger on that branch would have deployed to
#   production THIRTY-NINE TIMES, most of them mid-thought.
#
#   So the trigger must NOT watch the branch that is committed to daily. Two sane choices:
#
#     deploy branch   `git push <remote> HEAD:deploy` when you actually want to ship, where
#                     <remote> is whichever remote points at
#                     github.com/Abhicode0to1/new-reselleros (`origin` on Pardeep's
#                     machine as of 30 Sep 2026; older notes call it `anutech`).
#                     Committing and shipping stay separate decisions, and nothing about
#                     the day-to-day workflow changes. Recommended while one person works
#                     on a long-lived branch.
#
#     main            The normal answer for a team, and the right end state — but it needs
#                     those 166 commits merged into main first, which is a real decision
#                     and not a setup step.
#
# ─── THE BUILD CONTEXT IS production/, NOT THE REPO ROOT ─────────────────────
#   The Dockerfile lives in production/. Pointing Cloud Build at the repo root makes it fail
#   to find a Dockerfile and silently fall back to buildpacks, which then errors with "no
#   buildpack groups passed detection" — the same trap production/deploy.sh guards against
#   in its pre-flight.
#
# ─── THE PUBLIC VAPID KEY IS BAKED AT BUILD TIME, NOT SUPPLIED AT RUNTIME ────
#   It is already an ENV line inside production/Dockerfile, and it has to be: NEXT_PUBLIC_*
#   is substituted into the client bundle by `next build`, so a value provided only to the
#   running container arrives as undefined in the browser. Nothing to add here — but do not
#   "tidy" it out of the Dockerfile into this file's substitutions, or push will silently
#   report itself as unconfigured to every user.

steps:
  # 0. THE DEPLOY GATE (S18, Sep 2026). Typecheck + unit tests BEFORE the image is built, so
  #    a red commit pushed to `deploy` fails here and never reaches Cloud Run. Until this
  #    step existed, the only gate was .github/workflows/ci.yml, which runs in PARALLEL with
  #    this build and could only report a broken deploy, not stop it.
  #
  #    `next build` in step 1 still catches what tsc cannot (typedRoutes — see ci.yml), so
  #    the two together are the local gate (CLAUDE.md §25.2) minus lint; lint stays in CI.
  #    No env or secret is needed: the unit tests are pure logic (vitest.config.ts) and CI
  #    runs them the same way. node_modules made here does not enter the image —
  #    production/.dockerignore excludes it and the Dockerfile runs its own `npm ci`.
  #
  #    Cost: roughly 2-3 minutes on E2_HIGHCPU_8 (npm ci ~45s, tsc ~50s, vitest ~35s).
  #    To ship a hotfix while a test is red, fix or skip the test in a commit — do not
  #    delete this step; a deploy that skips the gate is how 26 Aug happened.
  - id: gate
    name: node:20
    dir: production
    # 2 Oct 2026 go-live: the gate died with "JavaScript heap out of memory" — Node's default
    # ~2 GB heap is too small for tsc over this app now. The machine has 8 GB (E2_HIGHCPU_8);
    # let Node use 6. Same checks, nothing skipped.
    env:
      - NODE_OPTIONS=--max-old-space-size=6144
    entrypoint: bash
    args:
      - -c
      - npm ci --no-audit --no-fund && npx prisma generate && npx next typegen && npx tsc --noEmit && npx vitest run

  # 0b. DEPS CACHE (5 Oct 2026, Pardeep: "cache kar do"). The note on --cache-from below was
  #     right: it never worked because nothing was pulled. Now the deps stage (npm ci, ~43s +
  #     COPY ~29s) has its own tag, pulled here and rebuilt from cache when package-lock.json
  #     is unchanged. Every step tolerates a miss: no tag yet, or a failed pull, just means a
  #     normal full build — this can never stop a deploy.
  #     Beside the gate (5 Oct 2026 trial on E2_HIGHCPU_32, 32 GB): with the memory there, the
  #     image no longer waits ~4 min for the tests. The gate still blocks the deploy — `push`
  #     below has no waitFor, so it waits for EVERY earlier step, the gate included.
  - id: deps-pull
    waitFor: ['-']
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [-c, 'docker pull $_IMAGE:deps || echo "no deps cache yet — full build"']
  - id: deps
    waitFor: [deps-pull]
    name: gcr.io/cloud-builders/docker
    dir: production
    args: [build, --target=deps, --cache-from=$_IMAGE:deps, --tag=$_IMAGE:deps, .]

  # 1. Build the image, exactly as deploy.sh does today.
  - id: build
    waitFor: [deps]
    name: gcr.io/cloud-builders/docker
    dir: production
    args:
      - build
      - --tag=$_IMAGE:$SHORT_SHA
      - --tag=$_IMAGE:latest
      # Wahi SHA ANDAR bhi, taaki chalti hui app /api/version par bata sake ki wo kaun sa
      # commit hai. Tag pehle se yahi kehta tha, par sirf repo me — is file ka apna comment
      # kehta hai "which build is live should never be a guess", aur 26 Aug 2026 ko wo
      # teen baar guess hi rahi. Dockerfile me ye runner stage ke aakhir me padta hai, to
      # badalta SHA build cache nahi todta.
      - --build-arg=BUILD_SHA=$SHORT_SHA
      - --build-arg=BUILD_ID=$BUILD_ID
      # Staging builds the same file with different substitutions (docs/STAGING.md). The
      # defaults below are the production values, so the `deploy` trigger is unchanged.
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=$_SUPABASE_URL
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=$_SUPABASE_ANON_KEY
      - --build-arg=NEXT_PUBLIC_APP_URL=$_APP_URL
      - --build-arg=NEXT_PUBLIC_APP_ENV=$_APP_ENV
      # R-161 no-VM switches (browser half). "" = off = the VM path, which is what production
      # gets until its own switch-over; the staging trigger sets 1 / authjs.
      - --build-arg=NEXT_PUBLIC_DATA_GATEWAY=$_DATA_GATEWAY
      - --build-arg=NEXT_PUBLIC_AUTH_PROVIDER=$_AUTH_PROVIDER
      # R-182: the gate above type-checks (typegen + tsc) and push waits for it.
      - --build-arg=SKIP_BUILD_TYPECHECK=1
      # ⚠️ YE FLAG LAGI HUI HAI PAR KABHI CHALI NAHI. 29 Aug 2026 par naapa: ek build ke
      # poore log me **ek bhi `CACHED` line nahi** — har layer har baar naye sire se banti
      # hai. Yahan pehle likha tha "Reuse the previous image's layers so a typical build is
      # minutes, not tens of them", jo kabhi sach nahi tha.
      #
      # Wajah Cloud Build ka jaana-maana jaal hai: `--cache-from` tab hi chalta hai jab wo
      # image pehle `docker pull` ki gayi ho, aur har build ek KHAALI machine par shuru hota
      # hai. Yahan koi pull step hai hi nahi.
      #
      # (5 Oct 2026: AB THEEK — step 0b pull karta hai aur deps stage ka apna tag hai. Neeche
      # ka paragraph us waqt ka faisla hai, record ke liye.)
      #
      # Jaan-boojhkar theek NAHI kiya gaya. Faayda sirf `npm ci` (43s) aur
      # `COPY --from=deps` (29s) tak hai — 431s me se 72s, aur wo bhi tab jab
      # package-lock.json na badla ho (pichhle 30 commit me 8 baar badla). Uske liye teen
      # naye step chahiye (deps stage ka apna tag, do pull, do cache-from), aur DEPLOY KA
      # RAASTA TODNA 72 SECOND SE KAHIN MEHNGA HAI. Asli waqt `next build` me jaata hai
      # (341s) — wo machineType se ladа gaya, neeche dekhein.
      #
      # Flag isliye chhodi hai ki wo nuksaan nahi karti, aur jis din pull step judega us din
      # kaam karne lagegi.
      - --cache-from=$_IMAGE:latest
      # The deps layers just built (or restored) in step 0b — this is what makes the cache real.
      - --cache-from=$_IMAGE:deps
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_IMAGE]

  # 2. Deploy. Pinned to the commit's own tag rather than :latest, so the revision can
  #    always be traced back to a SHA — "which build is live" should never be a guess.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      # >= Cloud Scheduler's --attempt-deadline=540s (setup-cloud-scheduler.sh). The 300s
      # default cut long crons off mid-run and Scheduler retried them from the top (S22).
      - --timeout=600
      # Cold starts (WC-ci, 30 Sep 2026): keep one instance warm and give each new instance
      # extra CPU while it boots. COST: roughly one small always-on instance (billed while
      # idle) — Pardeep approves this at deploy time. The staging trigger (R-106) sets
      # _MIN_INSTANCES=0 and _CPU_BOOST=no-cpu-boost so an unused staging costs nothing.
      - --min-instances=$_MIN_INSTANCES
      - --$_CPU_BOOST
      - --quiet
    # NOTE: no --set-env-vars here, deliberately. That flag REPLACES the whole set, and this
    # service carries eleven — including SUPABASE_SERVICE_ROLE_KEY, CRON_SECRET and
    # VAPID_PRIVATE_KEY. Omitting it entirely means `run deploy` keeps what is already
    # configured. If a variable ever needs adding, do it with
    # `gcloud run services update --update-env-vars`, never --set-env-vars.

substitutions:
  _REGION: asia-southeast1
  _SERVICE: resellersos
  # Build-time public values. Production defaults; the staging trigger overrides all four.
  _SUPABASE_URL: https://api.anutech.in
  _SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9udHBucWpveXNqZ3Jsc3VrZWNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNjc1NjcsImV4cCI6MjA5NDg0MzU2N30.tulYYDQSzq7IpEQCFbP7qjsSUxg4c-0ku5uO80-TKXI
  _APP_URL: https://reselleros.anutech.in
  _APP_ENV: ""
  # R-161: off by default (production keeps the VM until its own switch-over).
  _DATA_GATEWAY: ""
  _AUTH_PROVIDER: ""
  _MIN_INSTANCES: "1"
  _CPU_BOOST: cpu-boost
  # The same Artifact Registry path the current revision already runs from. The staging
  # trigger MUST override this (…/resellersos-staging): `images:` below also pushes :latest,
  # and a shared path would let a staging build overwrite production's latest tag.
  _IMAGE: asia-south1-docker.pkg.dev/resellsubsos-prod/cloud-run-source-deploy/resellersos

images:
  - $_IMAGE:$SHORT_SHA
  - $_IMAGE:latest
  - $_IMAGE:deps

options:
  logging: CLOUD_LOGGING_ONLY
  # The Next.js build is memory-hungry; the default machine has run out on this project's
  # size of app before.
  #
  # ─── 32 CORE AAZMAYE JA CHUKE HAIN. FAAYDA NAHI HUA. DOBARA MAT KARNA. ──────
  # 29 Aug 2026: ek build step-dar-step naapa (567s), aur 60% waqt akele `next build` me
  # mila. Lagta tha ki 8 vCPU kam hai — 128 page, 152 API route, 885 file.
  #
  # E2_HIGHCPU_32 par chala kar dekha:
  #
  #                        8 vCPU   32 vCPU
  #     npm ci                43s       38s
  #     COPY node_modules     29s       27s
  #     next compile         156s      131s
  #     compile ke baad      185s      167s   ← sabse bada hissa, mushkil se hila
  #     ─────────────────────────────────────
  #     KUL                  567s      505s
  #
  # 4 guna core, 11% farq. Aur ye 11% bharose layak bhi nahi: 8-core wale pichhle 6 build
  # **455s se 607s** ke beech the, aur 505 usi range ke andar hai. Ek sample us farq ko shor
  # se alag nahi kar sakta.
  #
  # Wajah bhi tabel me dikh rahi hai. Sabse bada hissa compile ke BAAD hai — typecheck, 280
  # route ka data ikattha karna, standalone output. Wo core ke saath nahi badhta. `next
  # build` yahan CPU se bandha hua hai hi nahi.
  #
  # Isliye wapas 8 par. Agar kabhi phir se badhane ka mann ho, to pehle ye tabel padhna —
  # aur ek nahi, dono taraf ke KAI build naapna, warna jawab shor hi milega.
  #
  # 5 Oct 2026 — DOOSRA TRIAL, alag sawaal: 32 core se `next build` tez nahi hota (upar), par
  # 32 GB memory gate aur image ko SAATH chalne deti hai (~4 min) aur 8 GB wala SIGKILL band
  # karti hai. Pardeep ne aazmaane ko kaha. Kai build naapo; fayda na dikhe to wapas
  # E2_HIGHCPU_8 aur build/deps-pull ka waitFor [gate] par.
  machineType: E2_HIGHCPU_32

# 2 Oct 2026: the first full go-live build (562 commits) hit 1800s inside `next build`.
timeout: 3600s
